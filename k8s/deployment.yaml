apiVersion: v1
kind: deployment
metadata:
  name: voting-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
    spec:
      containers:
        - name: voting-app-container
          image: voteapplication:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_path
              value: "/data/votesdb"
          volumeMounts:
            - name: voting-storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: voting-storage
          persistentVolumeClaim:
            claimName: voting-app-pvc